<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thông tin đăng ký</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Khung chứa toàn bộ nội dung -->
    <div class="khung-chinh">

        <!-- Phần tiêu đề -->
        <div class="tieu-de">

            <h1>Thông tin đăng ký</h1>

        </div>

        <!-- Form nhập thông tin -->
        <form>

            <!-- Họ tên -->
            <div class="nhom-form">

                <label>Họ tên:</label>

                <input type="text" placeholder="Nhập họ tên">

            </div>

            <!-- Ngày sinh -->
            <div class="nhom-form">

                <label>Ngày sinh:</label>

                <input type="date">

            </div>

            <!-- Giới tính -->
            <div class="nhom-form">

                <label>Giới tính:</label>

                <div class="gioi-tinh">

                    <input type="radio" name="gt"> Nam

                    <input type="radio" name="gt"> Nữ

                </div>

            </div>

            <!-- Địa chỉ -->
            <div class="nhom-form">

                <label>Địa chỉ:</label>

                <input type="text" placeholder="Nhập địa chỉ">

            </div>

            <!-- MSSV -->
            <div class="nhom-form">

                <label>MSSV:</label>

                <input type="text" placeholder="Nhập mã số sinh viên">

            </div>

            <!-- Lớp -->
            <div class="nhom-form">

                <label>Lớp:</label>

                <select>

                    <option>DA25TTC</option>

                    <option>DA25TTA</option>

                    <option>DA25TTB</option>

                </select>

            </div>

            <!-- Số điện thoại -->
            <div class="nhom-form">

                <label>Số điện thoại:</label>

                <input type="text" placeholder="Nhập số điện thoại">

            </div>

            <!-- Email -->
            <div class="nhom-form">

                <label>Email:</label>

                <input type="email" placeholder="Nhập email">

            </div>

            <!-- Ảnh đại diện -->
            <div class="nhom-form">

                <label>Ảnh đại diện:</label>

                <input type="file">

            </div>

            <!-- Sở trường -->
            <div class="nhom-form">

                <label>Sở trường:</label>

                <div class="so-truong">

                    <input type="checkbox"> Thiết kế web

                    <input type="checkbox"> Lập trình web

                    <input type="checkbox"> Thành thạo tiếng Trung

                </div>

            </div>

            <!-- Mô tả -->
            <div class="nhom-form mo-ta">

                <label>Mô tả sơ lược:</label>

                <textarea></textarea>

            </div>

            <!-- Nút bấm -->
            <div class="nut-bam">

                <button type="reset">
                    Hủy bỏ
                </button>

                <button type="submit">
                    Đăng ký
                </button>

            </div>

        </form>
        <a href="trang/lienhe.html" class="nut-lien-he">
    Quay lại trang liên hệ
</a>

    </div>

</body>

</html>
