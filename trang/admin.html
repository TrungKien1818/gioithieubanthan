<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Thông tin khách hàng</title>
</head>
<body>

<h1>Thông tin khách hàng</h1>
<div id="info"></div>

<script>
  console.log(localStorage.getItem("khachHang"));

  var data = JSON.parse(localStorage.getItem("khachHang"));

  if (data) {
      document.getElementById("info").innerHTML =
          "Họ tên: " + data.name + "<br>" +
          "Email: " + data.email + "<br>" +
          "Điện thoại: " + data.phone + "<br>" +
          "Tin nhắn: " + data.message;
  } else {
      document.getElementById("info").innerHTML = "Không có dữ liệu!";
  }
</script>

</body>
</html>
